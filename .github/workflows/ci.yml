name: ci

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/velveneer/sdcc-greenhouse

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Format check
        run: composer fmt:check

      - name: Tests
        run: composer test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: [self-hosted, deploy-greenhouse]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl (matched to cluster version)
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            SA=/var/run/secrets/kubernetes.io/serviceaccount
            VER=$(curl -s --cacert $SA/ca.crt \
              -H "Authorization: Bearer $(cat $SA/token)" \
              https://kubernetes.default.svc/version | grep -o '"gitVersion": *"[^"]*"' | cut -d'"' -f4)
            VER=${VER%%+*}
            curl -sfLo /tmp/kubectl "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl || mv /tmp/kubectl "$HOME/.local/bin/kubectl" 2>/dev/null || {
              mkdir -p "$HOME/bin" && mv /tmp/kubectl "$HOME/bin/kubectl" && echo "$HOME/bin" >> "$GITHUB_PATH"
            }
          fi
          kubectl version --client

      - name: Point kubectl at the in-cluster API via the pod ServiceAccount
        run: |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster local --server=https://kubernetes.default.svc \
            --certificate-authority=$SA/ca.crt
          kubectl config set-credentials sa --token="$(cat $SA/token)"
          kubectl config set-context local --cluster=local --user=sa --namespace=sdcc-greenhouse
          kubectl config use-context local

      - name: Roll out the new image
        run: |
          kubectl set image deployment/greenhouse simulator=${{ env.IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/greenhouse --timeout=180s
